name: Check Windows cluster test flags

on:
  push:
    branches:
      - ci/check-windows-cluster-flags

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      HEADLAMP_RUN_INTEGRATION_TESTS: true
      HEADLAMP_RUN_CLUSTER_TESTS: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.*'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Run tests and calculate code coverage
        working-directory: backend
        shell: bash
        run: |
          go test -v -count=1 ./... -coverprofile=coverage.out -covermode=atomic -coverpkg=./...
          go tool cover -func=coverage.out

